# Neo4j连接配置
# Docker 容器 depth_vlm_neo4j (neo4j:5.20.0)
#
# 重要(2026-07-22): data/logs 目录必须放在本地磁盘, 不能放 NAS!
#   原配置将 /data bind-mount 到 NAS(/mnt/.../data/neo4j/data), 导致 Neo4j
#   文件锁在 NFS 上抛 "Stale file handle", 容器反复重启 6621 次崩溃循环。
#   现已迁移至本地磁盘 /root/depth_vlm_neo4j/{data,logs}。
#   /import 保留指向 NAS 项目目录(仅存放 LOAD CSV 导入文件, 不涉及锁)。
#
# 启动: docker start depth_vlm_neo4j
# 停止: docker stop depth_vlm_neo4j
# Web 控制台: http://localhost:7474
#
# 连接 URI:
#   - 宿主机直连:        bolt://localhost:7687
#   - GPU_USFM_Paper 容器内: bolt://172.17.0.1:7687  (容器内 localhost≠宿主机, 需用网关IP)
uri: bolt://localhost:7687
user: neo4j
# TODO: 替换为你的 Neo4j 密码（切勿将真实密码提交到公开仓库, 建议用环境变量 NEO4J_PASSWORD 注入）
password: YOUR_NEO4J_PASSWORD
database: neo4j

# 向量索引配置
vector_dimensions: 512
vector_similarity: cosine

# 连接池
max_connection_pool_size: 50
connection_acquisition_timeout: 60

# 数据目录(本地磁盘, 非NAS)
# data_dir: /root/depth_vlm_neo4j/data
# logs_dir: /root/depth_vlm_neo4j/logs
